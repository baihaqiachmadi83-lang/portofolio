<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="p1Phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="p1Card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="p1Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="16" fill="url(#p1Bg)"/>

  <!-- Decorative Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="380"/>
    <line x1="180" y1="0" x2="180" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="420" y1="0" x2="420" y2="380"/>
    <line x1="540" y1="0" x2="540" y2="380"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="300" cy="190" r="140" fill="#2563eb" opacity="0.12" filter="blur(40px)"/>

  <!-- Left: Instructional Design Card / Concept -->
  <g transform="translate(45, 60)">
    <rect width="220" height="260" rx="14" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="18" width="130" height="22" rx="11" fill="rgba(37, 99, 235, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    <text x="24" y="33" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">INSTRUCTIONAL DESIGN</text>
    
    <text x="16" y="65" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Pedagogical Structure</text>
    <text x="16" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Target: Paket C Learners</text>

    <!-- Step 1: Rule Concept -->
    <g transform="translate(16, 96)">
      <rect width="188" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="21" r="10" fill="#2563eb"/>
      <text x="20" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
      <text x="38" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Grammar Rule Clarity</text>
      <text x="38" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">S + V1 (s/es) + Object</text>
    </g>

    <!-- Step 2: Interactive Practice -->
    <g transform="translate(16, 146)">
      <rect width="188" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="21" r="10" fill="#0284c7"/>
      <text x="20" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
      <text x="38" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Interactive Drills</text>
      <text x="38" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Sentence construction & choice</text>
    </g>

    <!-- Step 3: Self-Paced Reflection -->
    <g transform="translate(16, 196)">
      <rect width="188" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="21" r="10" fill="#10b981"/>
      <text x="20" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>
      <text x="38" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Self-Directed Learning</text>
      <text x="38" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Flexible access anytime</text>
    </g>
  </g>

  <!-- Right: Modern Smartphone Frame Preview -->
  <g transform="translate(320, 24)" filter="url(#p1Shadow)">
    <!-- Phone Bezel -->
    <rect width="230" height="332" rx="28" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    
    <!-- Screen -->
    <rect x="7" y="8" width="216" height="316" rx="22" fill="#f8fafc"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="80" y="15" width="70" height="12" rx="6" fill="#0f172a"/>

    <!-- App Header inside Phone -->
    <rect x="7" y="36" width="216" height="42" fill="#1e293b"/>
    <text x="22" y="61" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Simple Present Module</text>
    <rect x="175" y="49" width="36" height="18" rx="9" fill="#2563eb"/>
    <text x="193" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Paket C</text>

    <!-- Grammar Rule Card Inside Phone -->
    <g transform="translate(18, 90)">
      <rect width="194" height="68" rx="10" fill="url(#p1Card)"/>
      <text x="12" y="20" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="700">CORE FORMULA</text>
      <text x="12" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Subject + Verb-1 (s/es)</text>
      <text x="12" y="54" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9">Contoh: "She studies English daily."</text>
    </g>

    <!-- Interactive Exercise Mock -->
    <g transform="translate(18, 170)">
      <rect width="194" height="106" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="12" y="19" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Latihan Mandiri 01</text>
      <text x="12" y="34" fill="#475569" font-family="system-ui, sans-serif" font-size="9">He ______ to the market every morning.</text>

      <!-- Option A -->
      <rect x="12" y="44" width="170" height="22" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <text x="22" y="58" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">A. goes (Benar ✓)</text>

      <!-- Option B -->
      <rect x="12" y="72" width="170" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="22" y="86" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">B. going</text>
    </g>

    <!-- Bottom Nav Indicator inside Phone -->
    <rect x="80" y="316" width="70" height="3" rx="1.5" fill="#94a3b8"/>
  </g>
</svg>
