<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <filter id="p3Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="16" fill="url(#p3Bg)"/>

  <!-- Subtle ambient glow -->
  <circle cx="450" cy="180" r="140" fill="#0d9488" opacity="0.12" filter="blur(40px)"/>

  <!-- Left: Web Browser Window Mockup -->
  <g transform="translate(40, 36)" filter="url(#p3Shadow)">
    <!-- Browser Chrome Frame -->
    <rect width="320" height="308" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Browser Header Bar -->
    <rect width="320" height="34" rx="12" fill="#0f172a"/>
    <!-- Circles for close, minimize, maximize -->
    <circle cx="16" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="29" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="42" cy="17" r="4.5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="62" y="8" width="190" height="18" rx="9" fill="#1e293b"/>
    <text x="74" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">english-daily.pkbmtunasmandiri.edu</text>

    <!-- Browser Body Content -->
    <rect x="0" y="34" width="320" height="274" fill="#f8fafc"/>

    <!-- Hero Card inside web page -->
    <g transform="translate(14, 46)">
      <rect width="292" height="72" rx="10" fill="#0f766e"/>
      <text x="14" y="22" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="8" font-weight="700">PKBM TUNAS MANDIRI • DAILY PORTAL</text>
      <text x="14" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Today's English Expression</text>
      <text x="14" y="58" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="10">"Practice makes progress, step by step."</text>
    </g>

    <!-- Daily Dialogue Card -->
    <g transform="translate(14, 126)">
      <rect width="292" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Daily Conversation: Community Greetings</text>
      <rect x="12" y="26" width="160" height="14" rx="4" fill="#f1f5f9"/>
      <text x="16" y="36" fill="#475569" font-family="system-ui, sans-serif" font-size="8">A: "Good afternoon, Pak Budi. How are you?"</text>
      <rect x="12" y="44" width="175" height="14" rx="4" fill="#ccfbf1"/>
      <text x="16" y="54" fill="#0f766e" font-family="system-ui, sans-serif" font-size="8">B: "Good afternoon! I'm doing well, thank you."</text>
    </g>

    <!-- Interactive Quiz / Practice Row -->
    <g transform="translate(14, 198)">
      <rect width="292" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Quick Check: Vocabulary Match</text>
      <g transform="translate(12, 28)">
        <rect width="80" height="24" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
        <text x="40" y="44" fill="#0f766e" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Community</text>
      </g>
      <g transform="translate(100, 28)">
        <rect width="80" height="24" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
        <text x="140" y="44" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Masyarakat</text>
      </g>
      <g transform="translate(188, 28)">
        <rect width="90" height="24" rx="6" fill="#14b8a6"/>
        <text x="233" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Matched ✓</text>
      </g>
    </g>

    <!-- Footer strip inside browser -->
    <rect x="0" y="278" width="320" height="30" fill="#f1f5f9"/>
    <text x="16" y="297" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Developed for PKBM Tunas Mandiri Learners</text>
  </g>

  <!-- Right: Context Details -->
  <g transform="translate(385, 55)">
    <!-- Pill -->
    <rect width="134" height="24" rx="12" fill="rgba(20, 184, 166, 0.18)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1"/>
    <text x="12" y="16" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="10" font-weight="700">DIGITAL RESOURCE</text>

    <text x="0" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">English Daily</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sumber Belajar Kontekstual Nonformal</text>

    <g transform="translate(0, 94)">
      <rect width="180" height="52" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Materi Kontekstual</text>
      <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Situasi harian & lingkungan kerja</text>
    </g>

    <g transform="translate(0, 156)">
      <rect width="180" height="52" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Navigasi Simpel</text>
      <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Mudah dipahami peserta didik</text>
    </g>

    <g transform="translate(0, 218)">
      <rect width="180" height="52" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Live Web Deployment</text>
      <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Telah diunggah di GitHub Pages</text>
    </g>
  </g>
</svg>
