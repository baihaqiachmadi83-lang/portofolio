<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="p4Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="16" fill="url(#p4Bg)"/>

  <!-- Ambient light -->
  <circle cx="300" cy="180" r="130" fill="#6366f1" opacity="0.14" filter="blur(40px)"/>

  <!-- Left: Document Stack Mockup (RPP / Lesson Plan) -->
  <g transform="translate(50, 40)" filter="url(#p4Shadow)">
    <!-- Back Sheet (Worksheet) -->
    <rect x="25" y="10" width="220" height="280" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)" transform="rotate(4 135 150)"/>
    
    <!-- Front Sheet (RPP / Lesson Plan Document) -->
    <rect x="0" y="0" width="220" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Document Header Banner -->
    <rect x="0" y="0" width="220" height="48" rx="8" fill="#1e1b4b"/>
    <text x="14" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="7" font-weight="700">INSTRUCTIONAL DESIGN PORTFOLIO</text>
    <text x="14" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">RPP & Learning Module</text>

    <!-- Document Meta Grid -->
    <g transform="translate(14, 58)">
      <text x="0" y="10" fill="#64748b" font-family="system-ui, sans-serif" font-size="7" font-weight="600">SUBJECT:</text>
      <text x="50" y="10" fill="#0f172a" font-family="system-ui, sans-serif" font-size="7" font-weight="700">English Communication</text>

      <text x="0" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="7" font-weight="600">TOPIC:</text>
      <text x="50" y="22" fill="#4338ca" font-family="system-ui, sans-serif" font-size="7" font-weight="700">Hobbies, Dialogue & Speech</text>

      <line x1="0" y1="30" x2="192" y2="30" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <!-- Document Section 1: Objectives -->
    <g transform="translate(14, 98)">
      <rect width="192" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="14" fill="#4338ca" font-family="system-ui, sans-serif" font-size="7" font-weight="700">A. LEARNING OBJECTIVES</text>
      <text x="10" y="27" fill="#334155" font-family="system-ui, sans-serif" font-size="7">• Identifikasi struktur Simple Present & dialog</text>
      <text x="10" y="38" fill="#334155" font-family="system-ui, sans-serif" font-size="7">• Praktik mandiri interaktif & ekspresi sehari-hari</text>
    </g>

    <!-- Document Section 2: Teaching Script / Activity Matrix -->
    <g transform="translate(14, 152)">
      <rect width="192" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="14" fill="#0f172a" font-family="system-ui, sans-serif" font-size="7" font-weight="700">B. INSTRUCTIONAL STEPS</text>
      <text x="10" y="27" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">1. Warm-Up & Contextual Questions</text>
      <text x="10" y="37" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">2. Guided Vocabulary & Dialogue Exploration</text>
      <text x="10" y="47" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">3. Independent Formative Worksheet</text>
    </g>

    <!-- Document Stamp / Verification Seal -->
    <g transform="translate(130, 216)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="28" y="25" fill="#4f46e5" font-family="system-ui, sans-serif" font-size="6" font-weight="800" text-anchor="middle">VERIFIED</text>
      <text x="28" y="34" fill="#4f46e5" font-family="system-ui, sans-serif" font-size="5" font-weight="700" text-anchor="middle">MATERIAL</text>
    </g>
  </g>

  <!-- Right: Asset Badges & Topics -->
  <g transform="translate(310, 50)">
    <rect width="154" height="24" rx="12" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
    <text x="12" y="16" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">INSTRUCTIONAL ASSETS</text>

    <text x="0" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Dokumen & Perangkat Ajar</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Rancangan instruksional siap implementasi</text>

    <!-- Asset Item 1 -->
    <g transform="translate(0, 94)">
      <rect width="240" height="42" rx="8" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="10" y="10" width="22" height="22" rx="5" fill="#4f46e5"/>
      <text x="21" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">RPP</text>
      <text x="40" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Rencana Pelaksanaan Pembelajaran</text>
      <text x="40" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Struktur tujuan, langkah, & asesmen</text>
    </g>

    <!-- Asset Item 2 -->
    <g transform="translate(0, 144)">
      <rect width="240" height="42" rx="8" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="10" y="10" width="22" height="22" rx="5" fill="#0284c7"/>
      <text x="21" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">WS</text>
      <text x="40" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Student Worksheets & Activity</text>
      <text x="40" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Grammar, hobbies, introductions, dialogues</text>
    </g>

    <!-- Asset Item 3 -->
    <g transform="translate(0, 194)">
      <rect width="240" height="42" rx="8" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="10" y="10" width="22" height="22" rx="5" fill="#059669"/>
      <text x="21" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SC</text>
      <text x="40" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Teaching Script & Speech Guides</text>
      <text x="40" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Panduan instruktur & naskah pengajaran</text>
    </g>
  </g>
</svg>
