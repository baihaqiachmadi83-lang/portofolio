<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  <rect width="400" height="400" rx="32" fill="url(#grid)"/>

  <!-- Geometric Rings & Tech Orbit Elements -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="200" cy="200" r="95" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Tech Dots / Orbits -->
  <circle cx="200" cy="50" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="320" cy="200" r="3" fill="#60a5fa"/>
  <circle cx="80" cy="200" r="3" fill="#818cf8"/>
  <circle cx="200" cy="350" r="3" fill="#38bdf8"/>

  <!-- Center Badge / Monogram Container -->
  <circle cx="200" cy="180" r="75" fill="rgba(15, 23, 42, 0.85)" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Monogram AA -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left A -->
    <path d="M165 215 L185 145 L205 215"/>
    <path d="M172 192 L198 192"/>
    <!-- Right A (Intersecting / Modern Architectural style) -->
    <path d="M195 215 L215 145 L235 215" stroke="url(#accentGrad)"/>
    <path d="M202 192 L228 192" stroke="url(#accentGrad)"/>
  </g>

  <!-- Identity Label Pill -->
  <g transform="translate(110, 280)">
    <rect width="180" height="34" rx="17" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="90" y="21" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">ANNURIL B. A.</text>
  </g>

  <!-- Subtitle Tag -->
  <text x="200" y="335" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.5">Education × Technology × AI</text>
</svg>
