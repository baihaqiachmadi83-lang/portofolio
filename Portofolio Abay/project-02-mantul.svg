<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="mantulHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="p2Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="16" fill="url(#p2Bg)"/>

  <!-- Subtle ambient circles -->
  <circle cx="150" cy="190" r="120" fill="#3b82f6" opacity="0.1" filter="blur(35px)"/>
  <circle cx="480" cy="220" r="100" fill="#8b5cf6" opacity="0.12" filter="blur(30px)"/>

  <!-- Left: Mobile Device Mockup for MANTUL -->
  <g transform="translate(40, 24)" filter="url(#p2Shadow)">
    <rect width="224" height="332" rx="26" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <rect x="7" y="7" width="210" height="318" rx="20" fill="#f8fafc"/>
    
    <!-- Notch -->
    <rect x="75" y="13" width="60" height="10" rx="5" fill="#0f172a"/>

    <!-- App Bar -->
    <rect x="7" y="32" width="210" height="42" fill="#1e3a8a"/>
    <text x="20" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">MANTUL</text>
    <text x="75" y="56" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Package C Learning</text>
    
    <!-- Streak Pill inside App Bar -->
    <rect x="165" y="44" width="44" height="18" rx="9" fill="#fef3c7"/>
    <text x="187" y="56" fill="#b45309" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">🔥 3 Day</text>

    <!-- Content: Unit 01 Card -->
    <g transform="translate(16, 84)">
      <rect width="192" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="54" rx="2" fill="#2563eb"/>
      <rect x="12" y="10" width="34" height="34" rx="6" fill="#eff6ff"/>
      <text x="29" y="31" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">U1</text>
      <text x="54" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Vocabulary & Greetings</text>
      <text x="54" y="38" fill="#16a34a" font-family="system-ui, sans-serif" font-size="8" font-weight="600">✓ Completed (100%)</text>
    </g>

    <!-- Connector Line -->
    <line x1="33" y1="138" x2="33" y2="152" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Unit 02 Card -->
    <g transform="translate(16, 152)">
      <rect width="192" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="54" rx="2" fill="#3b82f6"/>
      <rect x="12" y="10" width="34" height="34" rx="6" fill="#f0fdf4"/>
      <text x="29" y="31" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">U2</text>
      <text x="54" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Speaking Practice</text>
      <text x="54" y="38" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="8" font-weight="600">▶ In Progress (60%)</text>
    </g>

    <!-- Connector Line -->
    <line x1="33" y1="206" x2="33" y2="220" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Unit 03 Card (Locked with ornament) -->
    <g transform="translate(16, 220)">
      <rect width="192" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" opacity="0.8"/>
      <rect x="0" y="0" width="5" height="54" rx="2" fill="#cbd5e1"/>
      <rect x="12" y="10" width="34" height="34" rx="6" fill="#f1f5f9"/>
      <text x="29" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">U3</text>
      <text x="54" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Reading Comprehension</text>
      <!-- Lock Badge -->
      <circle cx="178" cy="27" r="11" fill="url(#streakGrad)"/>
      <path d="M175 25 V23 A3 3 0 0 1 181 23 V25 M174 25 H182 V31 H174 Z" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Indicator -->
    <rect x="75" y="314" width="60" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Right: Architecture & Features Matrix -->
  <g transform="translate(290, 50)">
    <!-- Pill -->
    <rect width="146" height="24" rx="12" fill="rgba(59, 130, 246, 0.18)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    <text x="12" y="16" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="700">WEB APPLICATION</text>

    <text x="0" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">MANTUL Core Pillars</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Mobile Access for Nonformal Teaching & Ubiquitous Learning</text>

    <!-- Metric Card 1 -->
    <g transform="translate(0, 96)">
      <rect width="270" height="50" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="26" cy="25" r="14" fill="#2563eb" opacity="0.2"/>
      <path d="M22 25 L25 28 L30 22" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Data-Efficient & Lightweight</text>
      <text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Tanpa dependensi berat, hemat kuota mobile</text>
    </g>

    <!-- Metric Card 2 -->
    <g transform="translate(0, 156)">
      <rect width="270" height="50" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="26" cy="25" r="14" fill="#10b981" opacity="0.2"/>
      <path d="M22 25 L25 28 L30 22" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Autonomous & Tutor-Assisted</text>
      <text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Dirancang khusus untuk ritme belajar Paket C</text>
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(0, 216)">
      <rect width="270" height="50" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="26" cy="25" r="14" fill="#f59e0b" opacity="0.2"/>
      <path d="M22 25 L25 28 L30 22" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Gamifikasi Ringan & Progres</text>
      <text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Streak harian, unlockable unit, & evaluasi</text>
    </g>
  </g>
</svg>
