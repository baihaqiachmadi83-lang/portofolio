<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#favGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  
  <!-- Monogram AA Graphic -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- First A -->
    <path d="M16 46 L25 18 L34 46"/>
    <path d="M19 36 L31 36"/>
    
    <!-- Second A (Interlocked / Offset) -->
    <path d="M30 46 L39 18 L48 46"/>
    <path d="M33 36 L45 36"/>
  </g>
  
  <!-- Small Tech Dot / Accent -->
  <circle cx="51" cy="46" r="3" fill="#38bdf8"/>
</svg>
